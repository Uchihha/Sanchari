<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            color: #d63384;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: fadeIn 1s ease-in;
        }

        .name {
            color: #c41e3a;
            font-size: 4rem;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 3rem;
        }

        button {
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c41e3a 100%);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.4);
        }

        .no-btn {
            background: linear-gradient(135deg, #e0e0e0 0%, #b0b0b0 100%);
            color: #333;
        }

        .no-btn:hover {
            transform: scale(0.95);
        }

        .rose {
            position: fixed;
            font-size: 2.5rem;
            animation: fall linear infinite;
            z-index: 5;
            opacity: 0;
        }

        @keyframes fall {
            0% {
                opacity: 1;
                transform: translateY(-100px) rotate(0deg);
            }
            100% {
                opacity: 0.7;
                transform: translateY(100vh) rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1s ease-in;
        }

        .message-box {
            background: linear-gradient(135deg, #fff5f7 0%, #ffe0e9 100%);
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            text-align: center;
            border: 3px solid #ff6b9d;
        }

        .message-name {
            font-size: 4rem;
            color: #c41e3a;
            font-weight: bold;
            margin-bottom: 1.5rem;
            animation: popIn 0.6s ease-out;
        }

        .message-text {
            font-size: 1.4rem;
            color: #333;
            line-height: 1.8;
            margin-bottom: 1rem;
        }

        .message-highlight {
            font-size: 1.8rem;
            color: #c41e3a;
            font-weight: bold;
            margin-top: 1.5rem;
        }

        .heart {
            color: #ff1744;
            font-size: 2.5rem;
            animation: heartbeat 1s infinite;
            display: inline-block;
            margin-left: 0.5rem;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="container" id="question">
        <h1>Will you be my Valentine</h1>
        <h2 class="name">SANCHARI</h2>
        <div class="buttons">
            <button class="yes-btn" onclick="celebrate()">YES</button>
            <button class="no-btn" onclick="moveButton(event)">NO</button>
        </div>
    </div>

    <div class="message-container" id="message">
        <div class="message-box">
            <div class="message-name">SANCHARI</div>
            <p class="message-text">YOU ARE THE BEST</p>
            <p class="message-text">The best thing ever happened to me</p>
            <p class="message-text">You are my motivation to do anything big in life coz that will make you happy</p>
            <p class="message-highlight">I LOVE YOU <span class="heart">❤️</span></p>
        </div>
    </div>

    <script>
        function createRose() {
            const rose = document.createElement('div');
            rose.className = 'rose';
            rose.innerHTML = '🌹';
            rose.style.left = Math.random() * 100 + 'vw';
            rose.style.animationDuration = (Math.random() * 3 + 3) + 's';
            rose.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(rose);

            setTimeout(() => {
                rose.remove();
            }, 8000);
        }

        function celebrate() {
            // Create shower of roses
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createRose();
                }, i * 100);
            }

            // Hide question and show message after delay
            setTimeout(() => {
                document.getElementById('question').style.display = 'none';
                document.getElementById('message').style.display = 'flex';
            }, 1500);

            // Continue rose shower
            setInterval(() => {
                createRose();
            }, 300);
        }

        function moveButton(event) {
            const button = event.target;
            const maxX = window.innerWidth - button.offsetWidth;
            const maxY = window.innerHeight - button.offsetHeight;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            button.style.position = 'fixed';
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
